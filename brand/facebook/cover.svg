<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="624" viewBox="0 0 1640 624" role="img" aria-label="Tech Pulse Daily cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F1A"/>
      <stop offset="0.5" stop-color="#101828"/>
      <stop offset="1" stop-color="#0B1322"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.34"/>
      <stop offset="0.6" stop-color="#2563EB" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="0.55" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60A5FA" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#60A5FA" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#BAE6FD"/>
      <stop offset="0.65" stop-color="#60A5FA" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 H0 V48" fill="none" stroke="#FFFFFF" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1640" height="624" fill="url(#bg)"/>
  <ellipse cx="820" cy="286" rx="820" ry="440" fill="url(#halo)"/>
  <rect width="1640" height="624" fill="url(#grid)"/>

  <!-- brand mark -->
  <g transform="translate(784 158)">
    <rect width="72" height="72" rx="20" fill="url(#tile)"/>
    <path d="M10 36 H21 L26 25 L33 50 L38 29 L42 36 H62"
          fill="none" stroke="#FFFFFF" stroke-width="6"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="820" y="312" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="80" font-weight="600" letter-spacing="-1.5" fill="#F8FAFC">Tech Pulse Daily</text>

  <text x="820" y="352" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="21" font-weight="500" letter-spacing="7" fill="#93A4BF">AI · GADGETS · STARTUPS · DEV TOOLS</text>

  <!-- heartbeat baseline -->
  <path d="M0 424 H560" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>
  <path d="M1080 424 H1640" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>
  <path d="M560 424 H672 L700 424 L720 390 L748 458 L774 404 L792 424 H1080"
        fill="none" stroke="url(#pulse)" stroke-width="4.5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
